# Weekly update pull requests. Minor and patch updates of an ecosystem come together in one
# pull request; each major update comes alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # astro check (@astrojs/check) does not support TypeScript 7; drop this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The workflows' actions, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
